language: ko-KR

reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop

  profile: assertive

  path_filters:
    - "!package-lock.json"
    - "!public/mockServiceWorker.js"
    - "!dist/**"
    - "!coverage/**"
    - "!node_modules/**"

  tools:
    guidelines:
      - "React 컴포넌트는 UI 렌더링, 데이터 패칭, 라우팅 책임을 과하게 한 파일에 섞지 않는다."
      - "API 호출은 page/component 내부에 직접 흩뿌리지 않고 feature별 api 함수 또는 query/mutation hook으로 분리한다."
      - "API 응답 데이터는 TypeScript 타입을 정의하고, any 사용은 최소화한다."
      - "인증 토큰 접근은 공통 token storage 또는 auth store를 통해 처리한다."
      - "console.log, alert, 임시 테스트 코드는 프로덕션 코드에 남기지 않는다."
      - "dangerouslySetInnerHTML은 sanitize가 명시된 경우에만 허용한다."
      - "반복되는 toast, modal, image share, date validation 로직은 hook 또는 공용 컴포넌트로 분리한다."

chat:
  auto_reply: true
